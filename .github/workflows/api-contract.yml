name: API contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Restore
        run: dotnet restore CBSSupportSolution.sln
      - name: Build .NET 10 API without deferred OpenAPI generation
        run: dotnet build CBSSupport.API/CBSSupport.API.csproj --configuration Release --no-restore
      - name: Run non-OpenAPI tests
        run: dotnet test CBSSupport.API.Tests/CBSSupport.API.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName!~OpenApiContractTests
